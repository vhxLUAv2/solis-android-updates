name: Android Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.1.0"
        required: true
        type: string
      version_code:
        description: "Android versionCode, for example 1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: vhxLUAv2/solis-android
          token: ${{ secrets.SOLIS_RELEASE_UPDATES }}
          path: source
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Validate release secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "ANDROID_KEYSTORE_BASE64 is not configured." && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "ANDROID_KEYSTORE_PASSWORD is not configured." && exit 1)
          test -n "$KEY_ALIAS" || (echo "ANDROID_KEY_ALIAS is not configured." && exit 1)
          test -n "$KEY_PASSWORD" || (echo "ANDROID_KEY_PASSWORD is not configured." && exit 1)

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > source/solis-release.jks
          test -s source/solis-release.jks

      - name: Build signed APK
        working-directory: source
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/source/solis-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle clean assembleRelease \
            -PsolisVersionName="${{ inputs.version }}" \
            -PsolisVersionCode="${{ inputs.version_code }}"

      - name: Verify APK
        env:
          VERSION: ${{ inputs.version }}
        run: |
          APK="source/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"

          mkdir -p release
          cp "$APK" "release/Solis-Android-"$VERSION".apk"

      - name: Generate SHA-256
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sha256sum "release/Solis-Android-"$VERSION".apk" \
            | awk '{print $1}' > release/sha256.txt

      - name: Create latest.json
        env:
          VERSION: ${{ inputs.version }}
        run: |
          SHA256=$(cat release/sha256.txt)

          cat > release/latest.json <<EOF
          {
            "version": "$VERSION",
            "url": "https://github.com/vhxLUAv2/solis-android-updates/releases/download/v$VERSION/Solis-Android-$VERSION.apk",
            "sha256": "$SHA256",
            "mandatory": false
          }
          EOF

          cat release/latest.json

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION" \
            "release/Solis-Android-$VERSION.apk" \
            "release/latest.json" \
            --repo vhxLUAv2/solis-android-updates \
            --title "Solis Android v$VERSION" \
            --notes "Solis Android release v$VERSION"

      - name: Clean signing key
        if: always()
        run: rm -f source/solis-release.jks
